<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The House Quiz</title>
  <meta name="description" content="The House &middot; an object show" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="../styles.css" />
  <style>
    .quiz-wrap {
      max-width: 34rem;
      margin: 2rem auto 4rem;
    }
    .quiz-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--label);
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-bottom: 1rem;
    }
    .quiz-lives { letter-spacing: 0.15em; }
    .quiz-lives-wrap { position: relative; display: inline-block; }
    .quiz-life-popup {
      position: absolute;
      top: -0.2rem;
      right: 0;
      font-family: var(--label);
      font-size: 0.8rem;
      font-weight: bold;
      color: #2e7d32;
      opacity: 0;
      pointer-events: none;
    }
    .quiz-life-popup.show {
      animation: quiz-life-pop 1.2s ease forwards;
    }
    @keyframes quiz-life-pop {
      0% { opacity: 0; transform: translateY(4px) scale(0.9); }
      15% { opacity: 1; transform: translateY(-8px) scale(1.1); }
      30% { transform: translateY(-10px) scale(1); }
      70% { opacity: 1; transform: translateY(-16px) scale(1); }
      100% { opacity: 0; transform: translateY(-24px) scale(1); }
    }
    .quiz-card {
      background: var(--wall);
      border: var(--edge);
      border-radius: 4px;
      padding: 1.6rem 1.4rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.35);
    }
    .quiz-card.shake { animation: quiz-shake 0.35s ease; }
    @keyframes quiz-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }
    .quiz-question {
      font-family: var(--display);
      font-size: 1.25rem;
      color: var(--paper);
      margin: 0 0 1.2rem;
      line-height: 1.4;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .quiz-option {
      font-family: var(--body);
      font-size: 1rem;
      color: var(--ink);
      background: var(--wall-lit);
      border: var(--edge);
      border-radius: 3px;
      padding: 0.7rem 0.9rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .quiz-option:hover { background: var(--shadow); transform: translateX(2px); }
    .quiz-option.wrong-flash { background: var(--urgent); color: #fff; }
    .quiz-option.right-flash { background: #2e7d32; color: #fff; }
    .quiz-anagram-scramble {
      font-family: var(--display);
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: var(--lamp);
      text-align: center;
      margin: 0 0 1.2rem;
    }
    .quiz-anagram-row {
      display: flex;
      gap: 0.6rem;
    }
    .quiz-anagram-input {
      flex: 1;
      font-family: var(--body);
      font-size: 1rem;
      color: var(--ink);
      background: var(--wall-lit);
      border: var(--edge);
      border-radius: 3px;
      padding: 0.7rem 0.9rem;
    }
    .quiz-anagram-input.wrong-flash { background: var(--urgent); color: #fff; }
    .quiz-anagram-input.right-flash { background: #2e7d32; color: #fff; }
    .quiz-anagram-submit {
      font-family: var(--label);
      font-size: 0.9rem;
      color: var(--ink);
      background: var(--wall-lit);
      border: var(--edge);
      border-radius: 3px;
      padding: 0.7rem 1.1rem;
      cursor: pointer;
    }
    .quiz-anagram-submit:hover { background: var(--shadow); }
    .quiz-sort-caption {
      font-family: var(--label);
      font-size: 0.75rem;
      color: var(--ink-soft);
      text-align: center;
      margin: 0 0 0.4rem;
    }
    .quiz-sort-caption-bottom { margin: 0.6rem 0 1rem; }
    .quiz-sort-list {
      position: relative;
    }
    .quiz-sort-item {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      height: 2.8rem;
      padding: 0 0.9rem;
      font-family: var(--body);
      font-size: 1rem;
      color: var(--ink);
      background: var(--wall-lit);
      border: var(--edge);
      border-radius: 3px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }
    .quiz-sort-item.dragging {
      cursor: grabbing;
      z-index: 50;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }
    .quiz-sort-item.wrong-flash { background: var(--urgent); color: #fff; }
    .quiz-sort-item.right-flash { background: #2e7d32; color: #fff; }
    .quiz-sort-rank {
      font-family: var(--label);
      font-size: 0.8rem;
      color: var(--ink-soft);
      min-width: 1.4rem;
    }
    .quiz-sort-submit {
      display: block;
      margin: 1.2rem auto 0;
    }
    .quiz-feedback {
      font-family: var(--label);
      font-size: 0.8rem;
      color: var(--urgent);
      min-height: 1.2rem;
      margin-top: 1rem;
      text-align: center;
    }
    .quiz-done {
      text-align: center;
    }
    .quiz-password {
      display: inline-block;
      margin: 1rem 0;
      font-family: var(--label);
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      color: var(--lamp);
      background: var(--shadow);
      border: var(--edge);
      padding: 0.6rem 1.2rem;
      border-radius: 3px;
    }
    .quiz-puzzle-stage {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .quiz-puzzle-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      width: 100%;
      aspect-ratio: 1245 / 748;
    }
    .quiz-puzzle-slot {
      border: 1px dashed var(--ink-soft);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.03);
    }
    .quiz-puzzle-solved {
      text-align: center;
      font-family: var(--display);
      font-size: 1.1rem;
      color: #2e7d32;
      margin: 0.8rem 0 0;
    }
    .quiz-puzzle-scatter {
      position: relative;
      width: 100%;
      margin-top: 1rem;
    }
    .quiz-puzzle-piece {
      position: absolute;
      background-repeat: no-repeat;
      border-radius: 3px;
      border: var(--edge);
      cursor: grab;
      user-select: none;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);

      cursor: grabbing;
      z-index: 50;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

      text-align: center;
      font-family: var(--label);
      font-size: 0.75rem;
      color: var(--ink-soft);
      margin: 0.9rem 0 0;

</head>
<body>

  <site-header></site-header>

  <main class="wrap quiz-wrap">

    <h1>The House Quiz</h1>
    <p id="quizIntro">Answer every question correctly to receive a prize. You get a few mistakes per attempt &mdash; run out, and it's back to question one. Good luck.</p>

    <div id="quizPlay">
      <div class="quiz-status-row">
        <span id="quizProgress">Question 1 of 1</span>
        <span class="quiz-lives-wrap">
          <span class="quiz-lives" id="quizLives"></span>
          <span class="quiz-life-popup" id="quizLifePopup">+1</span>
        </span>
      </div>

      <div class="quiz-card" id="quizCard">
        <p class="quiz-question" id="quizQuestion"></p>
        <div class="quiz-options" id="quizOptions"></div>
        <div id="quizPuzzle" hidden>
          <div class="quiz-puzzle-stage" id="quizPuzzleStage">
            <div class="quiz-puzzle-board" id="quizPuzzleBoard"></div>
            <p class="quiz-puzzle-solved" id="quizPuzzleSolved" hidden>Solved!</p>
            <div class="quiz-puzzle-scatter" id="quizPuzzleScatter"></div>
          </div>
          <p class="quiz-puzzle-hint">Drag each piece onto its spot on the board.</p>
        </div>
        <div id="quizAnagram" hidden>
          <p class="quiz-anagram-scramble" id="quizAnagramScramble"></p>
          <div class="quiz-anagram-row">
            <input type="text" class="quiz-anagram-input" id="quizAnagramInput" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <button type="button" class="quiz-anagram-submit" id="quizAnagramSubmit">Submit</button>
          </div>
        </div>
        <div id="quizSort" hidden>
          <p class="quiz-sort-caption">Oldest</p>
          <div class="quiz-sort-list" id="quizSortList"></div>
          <p class="quiz-sort-caption quiz-sort-caption-bottom">Youngest</p>
          <button type="button" class="quiz-anagram-submit quiz-sort-submit" id="quizSortSubmit">Submit Order</button>
        </div>
      </div>

      <p class="quiz-feedback" id="quizFeedback"></p>
    </div>

    <div id="quizDone" class="quiz-done" hidden>
      <h2>You got them all.</h2>
      <span class="quiz-password" id="quizPasswordReveal"></span>
    </div>

  </main>

  <site-footer></site-footer>

  <script src="../components.js" defer></script>

    // Telly-style glitch text for the "who's in the basement" options — same
    // weighted-scramble technique as the name glitch on telly/index.html
    // (mostly noise, with the real character showing through occasionally),
    // rather than glitch.js's fully-redacted version. Tracked per-render so
    // old intervals get cleared instead of piling up as questions advance.
    const GLITCH_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789!@#$%&*<>?/\\|=+~';
    const GLITCH_REAL_WEIGHT = 8;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let activeGlitchIntervals = [];

    function clearGlitchIntervals() {
      activeGlitchIntervals.forEach(id => clearInterval(id));
      activeGlitchIntervals = [];
    }

    function startGlitchText(el, realText, ariaText) {
      el.textContent = realText;
      el.setAttribute('aria-label', ariaText || realText); // real text for screen readers
      if (reduceMotion) return; // static and legible — every option is correct anyway

      const id = setInterval(() => {
        let out = '';
        for (let i = 0; i < realText.length; i++) {
          const ch = realText[i];
          if (ch === ' ') { out += ' '; continue; }
          const pool = GLITCH_CHARS + ch.repeat(GLITCH_REAL_WEIGHT);
          out += pool[Math.floor(Math.random() * pool.length)];
        }
        el.textContent = out;
      }, 90);
      activeGlitchIntervals.push(id);
    }

    const sortListEl = document.getElementById('quizSortList');
    const sortSubmitEl = document.getElementById('quizSortSubmit');
    const feedbackEl = document.getElementById('quizFeedback');
    const playEl = document.getElementById('quizPlay');
    const doneEl = document.getElementById('quizDone');
    const passwordRevealEl = document.getElementById('quizPasswordReveal');

    function renderLives() {
      livesEl.textContent = '♥️'.repeat(lives) + '🤍'.repeat(Math.max(0, LIVES_START - lives));
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // an "All of the above" option only makes sense sitting after the
    // others, so it's pinned to the end instead of shuffling with them —
    // detected automatically by text, no per-question flag needed
    function shuffleOptions(question) {
      const indices = question.options.map((_, i) => i);
      const pinnedIndex = indices.find(i => question.options[i].trim().toLowerCase() === 'all of the above');
      const rest = indices.filter(i => i !== pinnedIndex);
      const shuffledRest = shuffleArray(rest);
      return pinnedIndex === undefined ? shuffledRest : [...shuffledRest, pinnedIndex];
    }

    // Bonus lives are tied to the 3 interactive question types themselves
    // (not a fixed "every 15th question" count) so removing or adding
    // regular questions elsewhere in the set never knocks these out of
    // alignment with the puzzle/sort/anagram questions they're meant to reward.
    const LIVES_CHECKPOINT_POSITIONS = new Set(
      QUESTIONS.reduce((positions, q, i) => {
        if (q.type === 'puzzle' || q.type === 'sort' || q.type === 'anagram') positions.push(i + 1);
        return positions;
      }, [])
    );

    function advance() {
      current++;

      if (LIVES_CHECKPOINT_POSITIONS.has(current)) {
        lives++;
        renderLives();
        lifePopupEl.classList.remove('show');
        void lifePopupEl.offsetWidth; // restart animation if it's already mid-run
        lifePopupEl.classList.add('show');
      }

      if (current >= QUESTIONS.length) {
        finishQuiz();
      } else {
        renderQuestion();
      }
    }

    function renderQuestion() {
      const q = QUESTIONS[current];
      progressEl.textContent = 'Question ' + (current + 1) + ' of ' + QUESTIONS.length;
      questionEl.textContent = q.q;
      feedbackEl.textContent = '';

      puzzleEl.hidden = true;
      clearPuzzleStage();
      anagramEl.hidden = true;
      sortEl.hidden = true;
      optionsEl.hidden = true;
      optionsEl.innerHTML = '';
      clearGlitchIntervals();

      if (q.type === 'puzzle') {
        puzzleEl.hidden = false;
        renderPuzzle(q);
        return;
      }

      if (q.type === 'anagram') {
        anagramEl.hidden = false;
        renderAnagram(q);
        return;
      }

      if (q.type === 'sort') {
        sortEl.hidden = false;
        renderSort(q);
        return;
      }

      optionsEl.hidden = false;

      const order = shuffleOptions(q);
      order.forEach(optionIndex => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quiz-option';
        if (q.glitch) {
          startGlitchText(btn, q.options[optionIndex], q.glitchAria);
        } else {
          btn.textContent = q.options[optionIndex];
        }
        const isCorrect = Array.isArray(q.correct) ? q.correct.includes(optionIndex) : optionIndex === q.correct;
        btn.addEventListener('click', () => {
          handleAnswer(
            isCorrect,
            btn,
            () => Array.from(optionsEl.children).forEach(b => b.disabled = true),
            () => Array.from(optionsEl.children).forEach(b => b.disabled = false)
          );
        });
        optionsEl.appendChild(btn);
      });
    }

    // Answer is compared letters-only (spaces/punctuation/case ignored) so
    // formatting quirks in what someone types don't matter. A fresh scramble
    // is generated every render (not a fixed list) — regenerated letter-by-
    // letter each time, so it's effectively unlimited variety rather than a
    // canned batch.
    let currentAnagramAnswer = '';

    function normalizeAnagramText(str) {
      return str.replace(/[^a-zA-Z]/g, '').toLowerCase();
    }

    function generateScramble(answer) {
      const wordGroups = answer.split(/\s+/).map(w => normalizeAnagramText(w));
      const wordLengths = wordGroups.map(w => w.length);
      const letters = wordGroups.join('').split('');

      let shuffled = shuffleArray(letters);
      while (shuffled.join('') === letters.join('')) {
        shuffled = shuffleArray(letters);
      }

      let cursor = 0;
      return wordLengths.map(len => {
        const chunk = shuffled.slice(cursor, cursor + len).join('');
        cursor += len;
        return chunk;
      }).join(' ');
    }

    function renderAnagram(q) {
      currentAnagramAnswer = normalizeAnagramText(q.answer);
      anagramScrambleEl.textContent = generateScramble(q.answer);
      anagramInputEl.value = '';
      anagramInputEl.disabled = false;
      anagramSubmitEl.disabled = false;
      anagramInputEl.classList.remove('wrong-flash', 'right-flash');
    }

    function checkAnagram() {
      if (anagramInputEl.disabled) return;
      const guess = normalizeAnagramText(anagramInputEl.value);
      if (!guess) return;

      handleAnswer(guess === currentAnagramAnswer, anagramInputEl, () => {
        anagramInputEl.disabled = true;
        anagramSubmitEl.disabled = true;
      }, () => {
        anagramInputEl.disabled = false;
        anagramSubmitEl.disabled = false;
        anagramInputEl.value = '';
        anagramInputEl.focus();
      });
    }

    anagramSubmitEl.addEventListener('click', checkAnagram);
    anagramInputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        checkAnagram();
      }
    });

    // Splits q.image into pieces scattered (and rotated) below an empty
    // board; drag each piece onto its spot to place it, straightening it out.
    // Solving costs no lives — it's a breather puzzle, not a quiz question
    // with a wrong answer.
    const PUZZLE_COLS = 4;
    const PUZZLE_ROWS = 3;

    function clearPuzzleStage() {
      puzzleBoardEl.innerHTML = '';
      puzzleScatterEl.innerHTML = '';
      puzzleStageEl.querySelectorAll('.quiz-puzzle-piece').forEach(p => p.remove());
      puzzleSolvedEl.hidden = true;
    }

    // Uses pixel-based background-size/position (measured off the actual
    // rendered board) rather than percentage tricks, so crops line up
    // exactly regardless of borders/gaps.
    function applyPieceBackground(piece, pieceIndex, image, gridSize) {
      const col = pieceIndex % PUZZLE_COLS;
      const row = Math.floor(pieceIndex / PUZZLE_COLS);
      const tileW = gridSize.width / PUZZLE_COLS;
      const tileH = gridSize.height / PUZZLE_ROWS;
      piece.style.backgroundImage = "url('" + image + "')";
      piece.style.backgroundSize = gridSize.width + 'px ' + gridSize.height + 'px';
      piece.style.backgroundPosition = (-col * tileW) + 'px ' + (-row * tileH) + 'px';
      piece.dataset.piece = pieceIndex;
    }

    function randomRotation() {
      return Math.random() * 40 - 20; // -20..20 deg
    }

    function renderPuzzle(q) {
      clearPuzzleStage();

      const pieceCount = PUZZLE_COLS * PUZZLE_ROWS;

      // Empty board slots — piece with index N belongs in slot N.
      const slots = [];
      for (let i = 0; i < pieceCount; i++) {
        const slot = document.createElement('div');
        slot.className = 'quiz-puzzle-slot';
        slot.dataset.slot = i;
        puzzleBoardEl.appendChild(slot);
        slots.push(slot);
      }

      const boardRect = puzzleBoardEl.getBoundingClientRect();
      const gridSize = { width: boardRect.width, height: boardRect.height };
      const tileW = gridSize.width / PUZZLE_COLS;
      const tileH = gridSize.height / PUZZLE_ROWS;

      // Give the scatter zone enough room for a rough grid of the pieces
      // beneath the board, then measure everything relative to the stage
      // (pieces are positioned absolutely against the stage so they can
      // move freely between the scatter zone and the board).
      const scatterRows = Math.ceil(pieceCount / PUZZLE_COLS);
      puzzleScatterEl.style.height = (scatterRows * tileH * 1.4) + 'px';

      const stageRect = puzzleStageEl.getBoundingClientRect();
      const scatterRect = puzzleScatterEl.getBoundingClientRect();
      const scatterOffsetX = scatterRect.left - stageRect.left;
      const scatterOffsetY = scatterRect.top - stageRect.top;
      const cellW = scatterRect.width / PUZZLE_COLS;
      const cellH = scatterRect.height / scatterRows;

      const slotPositions = slots.map(slot => {
        const r = slot.getBoundingClientRect();
        return { x: r.left - stageRect.left, y: r.top - stageRect.top };
      });

      const slotOccupant = new Array(pieceCount).fill(null); // slot -> piece
      const piecePlacement = new Array(pieceCount).fill(null); // piece -> slot
      const pieceEls = new Array(pieceCount);

      const spawnOrder = shuffleArray(Array.from({ length: pieceCount }, (_, i) => i));
      spawnOrder.forEach((pieceIndex, i) => {
        const piece = document.createElement('div');
        piece.className = 'quiz-puzzle-piece';
        piece.style.width = tileW + 'px';
        piece.style.height = tileH + 'px';
        applyPieceBackground(piece, pieceIndex, q.image, gridSize);

        const col = i % PUZZLE_COLS;
        const row = Math.floor(i / PUZZLE_COLS);
        const jitterX = (Math.random() - 0.5) * Math.max(0, cellW - tileW) * 0.8;
        const jitterY = (Math.random() - 0.5) * Math.max(0, cellH - tileH) * 0.8;
        const x = scatterOffsetX + col * cellW + (cellW - tileW) / 2 + jitterX;
        const y = scatterOffsetY + row * cellH + (cellH - tileH) / 2 + jitterY;

        piece.style.left = x + 'px';
        piece.style.top = y + 'px';
        piece.style.transform = 'rotate(' + randomRotation() + 'deg)';

        puzzleStageEl.appendChild(piece);
        pieceEls[pieceIndex] = piece;
      });

      attachPuzzlePieceDrag({ pieceEls, slotPositions, slotOccupant, piecePlacement, tileW, tileH });
    }

    function attachPuzzlePieceDrag(ctx) {
      const { pieceEls, slotPositions, slotOccupant, piecePlacement, tileW, tileH } = ctx;
      let dragPiece = null;
      let dragOrigin = null;
      let stageRect = null;
      let offsetX = 0, offsetY = 0;

      function checkSolved() {
        if (slotOccupant.every((piece, slot) => piece === slot)) {
          puzzleSolvedEl.hidden = false;
          setTimeout(advance, 1000);
        }
      }

      // Moves a bumped-out piece to a specific spot (and rotation) rather
      // than a random one — used so a displaced piece lands exactly where
      // the piece that took its place came from.
      function returnToSpot(piece, pieceIndex, spot) {
        piecePlacement[pieceIndex] = null;
        piece.style.left = spot.left + 'px';
        piece.style.top = spot.top + 'px';
        piece.style.transform = spot.transform;
      }

      // Finds which slot a stage-relative point falls inside, by coordinates
      // rather than document.elementFromPoint — a slot that already has a
      // piece in it is visually covered by that piece, so hit-testing the
      // DOM would find the occupying piece instead of the slot underneath.
      function slotAt(stageX, stageY) {
        for (let i = 0; i < slotPositions.length; i++) {
          const pos = slotPositions[i];
          if (stageX >= pos.x && stageX <= pos.x + tileW && stageY >= pos.y && stageY <= pos.y + tileH) {
            return i;
          }
        }
        return null;
      }

      // origin is where the incoming piece was dragged from (its spot in the
      // scatter zone, or null if it was already on the board) — a bumped
      // occupant gets sent there instead of to a random scatter position.
      function placeAt(piece, pieceIndex, slotIndex, origin) {
        const prevSlot = piecePlacement[pieceIndex];
        if (prevSlot !== null) slotOccupant[prevSlot] = null;

        const occupant = slotOccupant[slotIndex];
        if (occupant !== null && occupant !== pieceIndex) {
          if (prevSlot !== null) {
            // Both pieces were already on the board — swap them properly.
            placeAt(pieceEls[occupant], occupant, prevSlot, null);
          } else {
            returnToSpot(pieceEls[occupant], occupant, origin);
          }
        }

        slotOccupant[slotIndex] = pieceIndex;
        piecePlacement[pieceIndex] = slotIndex;

        const pos = slotPositions[slotIndex];
        piece.style.left = pos.x + 'px';
        piece.style.top = pos.y + 'px';
        piece.style.transform = 'rotate(0deg)';
      }

      pieceEls.forEach((piece, pieceIndex) => {
        piece.addEventListener('pointerdown', e => {
          if (dragPiece) return;
          dragPiece = piece;
          piece.setPointerCapture(e.pointerId);
          piece.classList.add('dragging');

          stageRect = puzzleStageEl.getBoundingClientRect();
          const curLeft = parseFloat(piece.style.left) || 0;
          const curTop = parseFloat(piece.style.top) || 0;
          offsetX = (e.clientX - stageRect.left) - curLeft;
          offsetY = (e.clientY - stageRect.top) - curTop;
          dragOrigin = { left: curLeft, top: curTop, transform: piece.style.transform };
        });

        piece.addEventListener('pointermove', e => {
          if (piece !== dragPiece) return;
          piece.style.left = ((e.clientX - stageRect.left) - offsetX) + 'px';
          piece.style.top = ((e.clientY - stageRect.top) - offsetY) + 'px';
        });

        piece.addEventListener('pointerup', e => {
          if (piece !== dragPiece) return;

          const targetSlot = slotAt(e.clientX - stageRect.left, e.clientY - stageRect.top);

          piece.classList.remove('dragging');
          dragPiece = null;

          if (targetSlot !== null) {
            placeAt(piece, pieceIndex, targetSlot, dragOrigin);
            checkSolved();
          } else {
            const prevSlot = piecePlacement[pieceIndex];
            if (prevSlot !== null) {
              slotOccupant[prevSlot] = null;
              piecePlacement[pieceIndex] = null;
            }
          }
        });

        piece.addEventListener('pointercancel', () => {
          if (piece === dragPiece) {
            piece.classList.remove('dragging');
            dragPiece = null;
          }
        });
      });
    }

    // Drag-to-sort question: a vertical list of items the player reorders
    // by dragging, checked against q.items (already given oldest-first)
    // when they hit submit. Unlike other question types, a wrong submit
    // doesn't reshuffle back to a fresh layout — the player's current
    // arrangement stays put so they can adjust it, and items already in
    // the right slot flash green even if the overall order is still wrong.
    const SORT_ITEM_GAP = 10; // px between stacked rows

    function renderSort(q) {
      sortListEl.innerHTML = '';
      sortSubmitEl.disabled = false;

      let displayOrder;
      do {
        displayOrder = shuffleArray(q.items.map((_, i) => i));
      } while (displayOrder.every((v, i) => v === i));

      const itemEls = displayOrder.map(correctIndex => {
        const el = document.createElement('div');
        el.className = 'quiz-sort-item';
        el.dataset.correctIndex = correctIndex;
        el.innerHTML = '<span class="quiz-sort-rank"></span><span class="quiz-sort-label">' + q.items[correctIndex] + '</span>';
        sortListEl.appendChild(el);
        return el;
      });

      attachSortDrag(itemEls);
    }

    function attachSortDrag(itemEls) {
      // `order` is the source of truth for display position (index 0 = top
      // "oldest" slot) — every item's top offset is derived from its index
      // here, not from DOM order, so a mid-drag reorder is just an array
      // move followed by a re-layout pass.
      let order = itemEls.slice();
      let itemH = 0;
      let dragEl = null;
      let dragStartTop = 0;
      let pointerStartY = 0;

      function layout(animate) {
        itemH = order[0].getBoundingClientRect().height;
        sortListEl.style.height = (order.length * itemH + (order.length - 1) * SORT_ITEM_GAP) + 'px';
        order.forEach((el, i) => {
          el.style.transition = (animate && el !== dragEl) ? 'top 0.15s ease' : 'none';
          el.querySelector('.quiz-sort-rank').textContent = (i + 1) + '.';
          if (el !== dragEl) {
            el.style.top = (i * (itemH + SORT_ITEM_GAP)) + 'px';
          }
        });
      }

      order.forEach(el => {
        el.addEventListener('pointerdown', e => {
          if (dragEl) return;
          dragEl = el;
          el.setPointerCapture(e.pointerId);
          el.classList.add('dragging');
          pointerStartY = e.clientY;
          dragStartTop = parseFloat(el.style.top) || 0;
        });

        el.addEventListener('pointermove', e => {
          if (el !== dragEl) return;
          const newTop = dragStartTop + (e.clientY - pointerStartY);
          el.style.top = newTop + 'px';

          const targetRank = Math.max(0, Math.min(order.length - 1, Math.round(newTop / (itemH + SORT_ITEM_GAP))));
          const currentRank = order.indexOf(el);
          if (targetRank !== currentRank) {
            order.splice(currentRank, 1);
            order.splice(targetRank, 0, el);
            layout(true);
          }
        });

        el.addEventListener('pointerup', () => {
          if (el !== dragEl) return;
          dragEl = null;
          el.classList.remove('dragging');
          layout(true);
        });

        el.addEventListener('pointercancel', () => {
          if (el === dragEl) {
            dragEl = null;
            el.classList.remove('dragging');
            layout(true);
          }
        });
      });

      layout(false);

      sortSubmitEl.onclick = () => {
        if (sortSubmitEl.disabled) return;
        sortSubmitEl.disabled = true;
        order.forEach(el => { el.style.pointerEvents = 'none'; });

        const correctness = order.map((el, i) => Number(el.dataset.correctIndex) === i);
        const isCorrect = correctness.every(Boolean);
        order.forEach((el, i) => {
          el.classList.add(correctness[i] ? 'right-flash' : 'wrong-flash');
        });

        if (isCorrect) {
          setTimeout(advance, 450);
          return;
        }

        lives--;
        renderLives();
        cardEl.classList.remove('shake');
        void cardEl.offsetWidth;
        cardEl.classList.add('shake');

        if (lives <= 0) {
          feedbackEl.textContent = "Out of lives. Back to the start.";
          setTimeout(() => {
            current = 0;
            lives = LIVES_START;
            renderLives();
            renderQuestion();
          }, 900);
        } else {
          feedbackEl.textContent = "Wrong. " + lives + " " + (lives === 1 ? "life" : "lives") + " left. Try this one again.";
          setTimeout(() => {
            order.forEach(el => {
              el.classList.remove('right-flash', 'wrong-flash');
              el.style.pointerEvents = '';
            });
            sortSubmitEl.disabled = false;
          }, 900);
        }
      };
    }

    function handleAnswer(isCorrect, btn, disableFn, resetFn) {
      disableFn();

      if (isCorrect) {
        btn.classList.add('right-flash');
        setTimeout(advance, 450);
      } else {
        btn.classList.add('wrong-flash');
        lives--;
        renderLives();
        cardEl.classList.remove('shake');
        void cardEl.offsetWidth;
        cardEl.classList.add('shake');

        if (lives <= 0) {
          feedbackEl.textContent = "Out of lives. Back to the start.";
          setTimeout(() => {
            current = 0;
            lives = LIVES_START;
            renderLives();
            renderQuestion();
          }, 900);
        } else {
          feedbackEl.textContent = "Wrong. " + lives + " " + (lives === 1 ? "life" : "lives") + " left. Try this one again.";
          // Reset in place rather than a full renderQuestion() — a fresh
          // render would reshuffle multiple-choice order, which made it
          // easy to misclick right after a wrong answer.
          setTimeout(() => {
            btn.classList.remove('wrong-flash');
            resetFn();
          }, 900);
        }
      }
    }

    function finishQuiz() {
      clearGlitchIntervals();
      playEl.hidden = true;
      doneEl.hidden = false;
      passwordRevealEl.textContent = PASSWORD_ANSWER;
    }

    renderLives();
    renderQuestion();
  </script>

</body>
</html>
