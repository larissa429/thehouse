<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook &middot; The House</title>
  <meta name="description" content="The House &middot; an object show" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital@0;1&family=Courier+Prime&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

  <site-header></site-header>

  <main class="wrap">

    <h1>Guestbook</h1>
    <p>Leave a doodle, a note, or both for the residents to find. Everything here is public — sign it however you like.</p>

    <div class="guestbook-layout">
    <div class="guestbook-card">
      <input type="text" id="visitorName" class="guestbook-input" placeholder="Your Name" required />
      <textarea id="visitorMessage" class="guestbook-textarea" placeholder="Message optional. You may also leave the drawing field blank."></textarea>

      <div class="guestbook-palette-groups">
        <div class="guestbook-palette-group">
          <button type="button" class="guestbook-palette-toggle active" data-palette="bright">Bright</button>
          <div class="guestbook-palette-row" data-palette-row="bright">
            <div class="guestbook-swatch active" style="background-color: #000000;" data-color="#000000"></div>
            <div class="guestbook-swatch" style="background-color: #ff1a4b;" data-color="#ff1a4b"></div>
            <div class="guestbook-swatch" style="background-color: #ff8c00;" data-color="#ff8c00"></div>
            <div class="guestbook-swatch" style="background-color: #ffe600;" data-color="#ffe600"></div>
            <div class="guestbook-swatch" style="background-color: #39ff14;" data-color="#39ff14"></div>
            <div class="guestbook-swatch" style="background-color: #00bfff;" data-color="#00bfff"></div>
            <div class="guestbook-swatch" style="background-color: #b026ff;" data-color="#b026ff"></div>
            <div class="guestbook-swatch" style="background-color: #ff3ec8;" data-color="#ff3ec8"></div>
          </div>
        </div>

        <div class="guestbook-palette-group">
          <button type="button" class="guestbook-palette-toggle" data-palette="pastel">Pastel</button>
          <div class="guestbook-palette-row" data-palette-row="pastel" hidden>
            <div class="guestbook-swatch" style="background-color: #cfcfcf;" data-color="#cfcfcf"></div>
            <div class="guestbook-swatch" style="background-color: #ffb3ba;" data-color="#ffb3ba"></div>
            <div class="guestbook-swatch" style="background-color: #ffdfba;" data-color="#ffdfba"></div>
            <div class="guestbook-swatch" style="background-color: #ffffba;" data-color="#ffffba"></div>
            <div class="guestbook-swatch" style="background-color: #baffc9;" data-color="#baffc9"></div>
            <div class="guestbook-swatch" style="background-color: #bae1ff;" data-color="#bae1ff"></div>
            <div class="guestbook-swatch" style="background-color: #d5baff;" data-color="#d5baff"></div>
            <div class="guestbook-swatch" style="background-color: #ffbaf0;" data-color="#ffbaf0"></div>
          </div>
        </div>

        <div class="guestbook-palette-group">
          <button type="button" class="guestbook-palette-toggle" data-palette="dark">Dark</button>
          <div class="guestbook-palette-row" data-palette-row="dark" hidden>
            <div class="guestbook-swatch" style="background-color: #000000;" data-color="#000000"></div>
            <div class="guestbook-swatch" style="background-color: #7a1f2b;" data-color="#7a1f2b"></div>
            <div class="guestbook-swatch" style="background-color: #7a4a1f;" data-color="#7a4a1f"></div>
            <div class="guestbook-swatch" style="background-color: #7a6a1f;" data-color="#7a6a1f"></div>
            <div class="guestbook-swatch" style="background-color: #1f4a2b;" data-color="#1f4a2b"></div>
            <div class="guestbook-swatch" style="background-color: #1f2f5c;" data-color="#1f2f5c"></div>
            <div class="guestbook-swatch" style="background-color: #3a1f5c;" data-color="#3a1f5c"></div>
            <div class="guestbook-swatch" style="background-color: #5c1f4a;" data-color="#5c1f4a"></div>
          </div>
        </div>
      </div>

      <div class="guestbook-history-row">
        <span class="guestbook-history-label">Recent:</span>
        <div class="guestbook-history" id="colorHistory"></div>
      </div>

      <div class="guestbook-controls">
        <div class="guestbook-size-row">
          <label for="sizeSlider" class="guestbook-size-label">Brush Size</label>
          <input type="range" id="sizeSlider" class="guestbook-slider" min="1" max="30" value="5" />
          <span id="sizeValue" class="guestbook-size-value">5px</span>
        </div>
        <button type="button" id="eraserBtn" class="guestbook-btn guestbook-btn-eraser">Eraser 🧼</button>
      </div>

      <div class="guestbook-stamps-row">
        <span class="guestbook-history-label">Stamps:</span>
        <div class="guestbook-stamps">
          <button type="button" class="guestbook-stamp-btn" data-stamp="house" title="House">&#127968;</button>
          <button type="button" class="guestbook-stamp-btn" data-stamp="star" title="Star">&#11088;</button>
          <button type="button" class="guestbook-stamp-btn" data-stamp="heart" title="Heart">&#10084;&#65039;</button>
          <button type="button" class="guestbook-stamp-btn" data-stamp="circle" title="Circle">&#9679;</button>
          <button type="button" id="stampOffBtn" class="guestbook-stamp-btn" title="Back to pen">&#9998;&#65039;</button>
        </div>
      </div>

      <canvas id="artCanvas" class="guestbook-canvas" width="400" height="400"></canvas>

      <div class="guestbook-tools-row">
        <button type="button" id="undoBtn" class="guestbook-btn guestbook-btn-tool">Undo</button>
        <button type="button" id="redoBtn" class="guestbook-btn guestbook-btn-tool">Redo</button>
        <button type="button" id="uploadBtn" class="guestbook-btn guestbook-btn-tool">Upload Image</button>
        <input type="file" id="uploadInput" accept="image/*" hidden />
        <button type="button" id="exportBtn" class="guestbook-btn guestbook-btn-tool">Save Image</button>
      </div>

      <div class="guestbook-btn-row">
        <button type="button" id="clearBtn" class="guestbook-btn guestbook-btn-clear">Clear Canvas</button>
        <button type="button" id="submitBtn" class="guestbook-btn guestbook-btn-submit">Submit</button>
      </div>
    </div>

    <div class="guestbook-gallery">
      <h2 class="guestbook-gallery-title">Gallery</h2>
      <div class="gallery-wall" id="guestbookWall">
        <!-- populated by JS from Firestore; falls back to an example
             piece (gimmick.png) if nothing's been submitted yet -->
      </div>
    </div>
    </div>

  </main>

  <div class="photo-overlay" id="guestbookOverlay">
    <button class="photo-close" id="guestbookOverlayClose">&times;</button>
    <div class="guestbook-lightbox">
      <img loading="lazy" id="guestbookOverlayImg" src="" alt="" />
      <p class="guestbook-lightbox-name" id="guestbookOverlayName"></p>
      <p class="guestbook-lightbox-message" id="guestbookOverlayMessage"></p>
      <p class="guestbook-lightbox-reply" id="guestbookOverlayReply"></p>
    </div>
  </div>

  <site-footer></site-footer>

  <script src="../components.js" defer></script>

  <script type="module">
    // 1. Import Firebase from the official Google CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALJut-42S2SOUz7pZXJj2A5AMe3QHd0o0",
      authDomain: "thehouse-f578b.firebaseapp.com",
      projectId: "thehouse-f578b",
      storageBucket: "thehouse-f578b.firebasestorage.app",
      messagingSenderId: "60360197597",
      appId: "1:60360197597:web:21d011ec9ac8111f15a234",
      measurementId: "G-CMQQ8JFV2V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    signInAnonymously(auth)
      .then(() => {
        console.log("Logged in anonymously!");
        loadGallery(); // wait for auth so Firestore rules requiring a
                        // signed-in (even anonymous) user pass on load
      })
      .catch((error) => console.error("Anonymous login failed: ", error));

    // --- GALLERY: the right-hand wall of submitted drawings ---
    const EXAMPLE_ENTRY = { name: 'Straw', imageUrl: '../images/gimmick.png', example: true };
    const galleryWall = document.getElementById('guestbookWall');

    // entries only ever had one flat reply before hostReplies existed —
    // treat that as a one-item list so nothing already saved disappears
    function getReplies(entry) {
      if (Array.isArray(entry.hostReplies) && entry.hostReplies.length) return entry.hostReplies;
      if (entry.hostReply) {
        return [{
          character: entry.hostReplyCharacter || 'The House',
          emoji: entry.hostReplyEmoji || '🏠',
          text: entry.hostReply,
        }];
      }
      return [];
    }

    function renderGalleryEntries(entries) {
      galleryWall.innerHTML = '';
      entries.forEach(entry => {
        const frame = document.createElement('figure');
        frame.className = 'gallery-frame';
        const replies = getReplies(entry);

        frame.dataset.name = entry.example ? entry.name + ' (example)' : entry.name;
        frame.dataset.message = entry.message || '';
        frame.dataset.replies = JSON.stringify(replies);

        // text-only submissions (no drawing) get a note card instead of
        // an <img> — there's nothing to show a picture of
        if (entry.imageUrl) {
          const img = document.createElement('img');
          img.src = entry.imageUrl;
          img.alt = '';
          img.draggable = false;
          frame.appendChild(img);
        } else {
          const note = document.createElement('div');
          note.className = 'guestbook-text-card';
          note.textContent = entry.message ? entry.message : '— left no message —';
          frame.appendChild(note);
        }

        const plate = document.createElement('figcaption');
        plate.className = 'gallery-plate';
        const plateText = entry.example ? entry.name + ' (example)' : entry.name;
        plate.textContent = plateText;
        // long names would otherwise wrap to two left-leaning lines —
        // shrink the font a bit instead so most names still fit on one
        if (plateText.length > 10) plate.style.fontSize = '0.7rem';
        frame.appendChild(plate);

        if (replies.length) {
          // one emoji per distinct character, not one per message — a
          // back-and-forth between the same two residents still only
          // shows two icons up top
          const uniqueCharacters = [...new Map(replies.map(r => [r.character, r])).values()];
          const badge = document.createElement('span');
          badge.className = 'gallery-reply-badge';
          badge.textContent = uniqueCharacters.map(r => r.emoji).join(' ');
          badge.title = uniqueCharacters.map(r => r.character).join(', ') + ' replied';
          frame.appendChild(badge);
        }

        galleryWall.appendChild(frame);
      });
    }

    // --- LIGHTBOX: click a drawing to see its name + message full-size ---
    const guestbookOverlay = document.getElementById('guestbookOverlay');
    const guestbookOverlayImg = document.getElementById('guestbookOverlayImg');
    const guestbookOverlayName = document.getElementById('guestbookOverlayName');
    const guestbookOverlayMessage = document.getElementById('guestbookOverlayMessage');
    const guestbookOverlayClose = document.getElementById('guestbookOverlayClose');

    function closeGuestbookLightbox() {
      guestbookOverlay.classList.remove('open');
    }
    guestbookOverlayClose.addEventListener('click', closeGuestbookLightbox);
    guestbookOverlay.addEventListener('click', (e) => {
      if (e.target === guestbookOverlay) closeGuestbookLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeGuestbookLightbox();
    });

    const guestbookOverlayReply = document.getElementById('guestbookOverlayReply');

    // minimal, safe markdown for the host reply only: escape everything
    // first, then turn **bold** and *italic* into real tags — the input
    // is admin-only (Firestore rules restrict writes to the admin email)
    // but we escape anyway so nothing weird can slip through
    function formatHostReply(text) {
      const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return escaped
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/__(.+?)__/g, '<u>$1</u>');
    }

    galleryWall.addEventListener('click', (e) => {
      const frame = e.target.closest('.gallery-frame');
      if (!frame || !frame.dataset.name) return;
      const img = frame.querySelector('img');
      guestbookOverlayImg.src = img ? img.src : '';
      guestbookOverlayImg.style.display = img ? '' : 'none';
      guestbookOverlayName.textContent = frame.dataset.name || '';
      const message = frame.dataset.message || '';
      guestbookOverlayMessage.textContent = message;
      guestbookOverlayMessage.style.display = message ? '' : 'none';
      let replies = [];
      try { replies = JSON.parse(frame.dataset.replies || '[]'); } catch (e) { replies = []; }
      guestbookOverlayReply.innerHTML = replies
        .map(r => {
          const photo = r.imageUrl ? '<img class="guestbook-reply-photo" src="' + r.imageUrl + '" alt="" />' : '';
          const line = r.text ? r.emoji + ' ' + r.character + ': "' + formatHostReply(r.text) + '"' : r.emoji + ' ' + r.character + ':';
          return photo + line;
        })
        .join('<br><br>');
      guestbookOverlayReply.style.display = replies.length ? '' : 'none';
      guestbookOverlay.classList.add('open');
    });

    async function loadGallery() {
      try {
        // only ever show entries a moderator has approved — new
        // submissions start as "pending" and are invisible here until
        // then (see the review page for approving/rejecting them)
        const q = query(
          collection(db, 'guestbook'),
          where('status', '==', 'approved'),
          orderBy('submittedAt', 'desc')
        );
        const snap = await getDocs(q);
        if (snap.empty) {
          renderGalleryEntries([EXAMPLE_ENTRY]);
          return;
        }
        const entries = [];
        snap.forEach(doc => entries.push(doc.data()));
        renderGalleryEntries(entries);
      } catch (error) {
        console.error('Could not load gallery: ', error);
        renderGalleryEntries([EXAMPLE_ENTRY]); // don't leave the wall empty on error either
      }
    }

    // --- DRAWING CANVAS LOGIC ---
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');
    let isDrawing = false;
    let hasDrawn = false; // tracks whether anything's actually been drawn/stamped

    ctx.lineCap = 'round';

    // the canvas's white background is only CSS on the <canvas> element
    // itself — the actual pixel bitmap starts fully transparent, so
    // toDataURL() would export a transparent PNG unless we explicitly
    // paint white into the real pixel data first
    function fillWhite() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    fillWhite();

    // --- PALETTE GROUPS: click a group's label to expand/collapse its row ---
    const paletteToggles = document.querySelectorAll('.guestbook-palette-toggle');
    paletteToggles.forEach(toggle => {
      toggle.addEventListener('click', () => {
        const key = toggle.getAttribute('data-palette');
        const row = document.querySelector('.guestbook-palette-row[data-palette-row="' + key + '"]');
        const alreadyOpen = toggle.classList.contains('active');

        paletteToggles.forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.guestbook-palette-row').forEach(r => r.hidden = true);

        if (!alreadyOpen) {
          toggle.classList.add('active');
          row.hidden = false;
        }
      });
    });

    // --- COLOR SWATCH LOGIC (delegated, since swatches live across 3 rows) ---
    let strokeColor = '#000000'; // Default drawing color (black)
    let previousColor = '#000000'; // Stores last color used

    function allSwatches() {
      return document.querySelectorAll('.guestbook-swatch');
    }

    function selectColor(color, swatchEl) {
      isEraser = false;
      eraserBtn.classList.remove('active');
      // deliberately NOT calling setStamp(null) here — picking a new
      // color should update the stamp's fill without kicking you back
      // to the pen tool

      allSwatches().forEach(s => s.classList.remove('active'));
      if (swatchEl) swatchEl.classList.add('active');

      strokeColor = color;
      previousColor = color;
      addToHistory(color);
    }

    document.querySelector('.guestbook-palette-groups').addEventListener('click', (e) => {
      const swatch = e.target.closest('.guestbook-swatch');
      if (!swatch) return;
      selectColor(swatch.getAttribute('data-color'), swatch);
    });

    // --- RECENT COLOR HISTORY ---
    const historyEl = document.getElementById('colorHistory');
    const colorHistory = [];
    const MAX_HISTORY = 8;

    function addToHistory(color) {
      const existingIndex = colorHistory.indexOf(color);
      if (existingIndex !== -1) colorHistory.splice(existingIndex, 1);
      colorHistory.unshift(color);
      if (colorHistory.length > MAX_HISTORY) colorHistory.pop();
      renderHistory();
    }

    function renderHistory() {
      historyEl.innerHTML = '';
      colorHistory.forEach(color => {
        const sw = document.createElement('div');
        sw.className = 'guestbook-swatch guestbook-history-swatch';
        sw.style.backgroundColor = color;
        sw.setAttribute('data-color', color);
        historyEl.appendChild(sw);
      });
    }

    historyEl.addEventListener('click', (e) => {
      const swatch = e.target.closest('.guestbook-history-swatch');
      if (!swatch) return;
      // find a matching live palette swatch to mark active, if the color
      // happens to be in a currently-visible palette — otherwise just
      // set the color with nothing else marked active
      const color = swatch.getAttribute('data-color');
      const match = Array.from(allSwatches()).find(s => s.getAttribute('data-color') === color && s !== swatch);
      selectColor(color, match);
    });

    // --- BRUSH SIZE SLIDER ---
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    let strokeWidth = parseInt(sizeSlider.value, 10);

    sizeSlider.addEventListener('input', () => {
      strokeWidth = parseInt(sizeSlider.value, 10);
      sizeValue.textContent = strokeWidth + 'px';
    });

    // --- ERASER TOOL LOGIC ---
    const eraserBtn = document.getElementById('eraserBtn');
    let isEraser = false;

    eraserBtn.addEventListener('click', () => {
      isEraser = !isEraser;
      if (isEraser) {
        setStamp(null);
        eraserBtn.classList.add('active');
        allSwatches().forEach(s => s.classList.remove('active'));
        strokeColor = '#ffffff'; // Painting with canvas background color (white)
      } else {
        eraserBtn.classList.remove('active');
        strokeColor = previousColor;
        const activeSwatch = Array.from(allSwatches()).find(s => s.getAttribute('data-color') === previousColor);
        if (activeSwatch) activeSwatch.classList.add('active');
      }
    });

    // --- STAMPS: house/star/heart/circle shapes, drawn as vector paths
    // (no image assets needed) — clicking the canvas while a stamp is
    // selected places one shape instead of drawing a freehand line ---
    const stampBtns = document.querySelectorAll('.guestbook-stamp-btn[data-stamp]');
    const stampOffBtn = document.getElementById('stampOffBtn');
    let currentStamp = null;

    function setStamp(type) {
      currentStamp = type;
      stampBtns.forEach(b => b.classList.toggle('active', b.getAttribute('data-stamp') === type));
    }

    stampBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        isEraser = false;
        eraserBtn.classList.remove('active');
        strokeColor = previousColor;
        setStamp(btn.getAttribute('data-stamp'));
      });
    });
    stampOffBtn.addEventListener('click', () => setStamp(null));

    function drawStampShape(type, cx, cy, s, color) {
      ctx.fillStyle = color;

      if (type === 'house') {
        const halfW = s / 2;
        const roofOverhang = halfW * 1.35; // roof eaves stick out past the walls
        const bodyTop = cy;
        const bodyBottom = cy + s * 0.6;
        const lw = Math.max(1, s * 0.05);
        ctx.beginPath();
        ctx.moveTo(cx, cy - s * 0.55);          // roof apex
        ctx.lineTo(cx + roofOverhang, bodyTop);  // down the roof's right slope, past the wall
        ctx.lineTo(cx + halfW, bodyTop);         // in to the right wall
        ctx.lineTo(cx + halfW, bodyBottom);      // down the right wall
        ctx.lineTo(cx - halfW, bodyBottom);      // across the bottom
        ctx.lineTo(cx - halfW, bodyTop);         // up the left wall
        ctx.lineTo(cx - roofOverhang, bodyTop);  // out to the left roof eave
        ctx.closePath();
        ctx.fill();
        // doorway — overshoots past the bottom edge so it fully clips
        // through the outline stroke instead of leaving a thin line
        // across the opening
        ctx.beginPath();
        ctx.rect(cx - s * 0.11, bodyBottom - s * 0.32, s * 0.22, s * 0.32 + lw);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      } else if (type === 'circle') {
        ctx.beginPath();
        ctx.arc(cx, cy, s / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'star') {
        const spikes = 5;
        const outerR = s / 2;
        const innerR = outerR * 0.45;
        let rot = -Math.PI / 2;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        for (let i = 0; i < spikes; i++) {
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
          rot += step;
          ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        }
        ctx.closePath();
        ctx.fill();
      } else if (type === 'heart') {
        const w = s, h = s;
        ctx.beginPath();
        ctx.moveTo(cx, cy + h * 0.28);
        ctx.bezierCurveTo(cx, cy, cx - w / 2, cy, cx - w / 2, cy + h * 0.28);
        ctx.bezierCurveTo(cx - w / 2, cy + h * 0.55, cx, cy + h * 0.7, cx, cy + h * 0.95);
        ctx.bezierCurveTo(cx, cy + h * 0.7, cx + w / 2, cy + h * 0.55, cx + w / 2, cy + h * 0.28);
        ctx.bezierCurveTo(cx + w / 2, cy, cx, cy, cx, cy + h * 0.28);
        ctx.closePath();
        ctx.fill();
      }
    }

    function stampAt(x, y) {
      pushUndoSnapshot();
      const s = Math.max(24, strokeWidth * 3);
      drawStampShape(currentStamp, x, y, s, strokeColor);
      hasDrawn = true;
    }

    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      // the canvas's internal bitmap is a fixed 400x400, but CSS renders
      // it at whatever size the layout gives it (much smaller than 400
      // on a phone) — without this scale factor, raw CSS-pixel offsets
      // get used directly as bitmap coordinates, so the drawing point
      // drifts away from the actual finger position the smaller the
      // canvas is rendered on screen
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // --- UNDO / REDO (snapshot-based) ---
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const undoStack = [];
    const redoStack = [];
    const MAX_HISTORY_STATES = 25;

    function snapshot() {
      return ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
    function pushUndoSnapshot() {
      undoStack.push(snapshot());
      if (undoStack.length > MAX_HISTORY_STATES) undoStack.shift();
      redoStack.length = 0; // a new stroke invalidates the redo history
    }

    undoBtn.addEventListener('click', () => {
      if (undoStack.length === 0) return;
      redoStack.push(snapshot());
      ctx.putImageData(undoStack.pop(), 0, 0);
    });
    redoBtn.addEventListener('click', () => {
      if (redoStack.length === 0) return;
      undoStack.push(snapshot());
      ctx.putImageData(redoStack.pop(), 0, 0);
    });

    function startDrawing(e) {
      if (currentStamp) {
        const { x, y } = getCoordinates(e);
        stampAt(x, y);
        return; // stamps place once per click, no continuous drawing
      }
      pushUndoSnapshot();
      isDrawing = true;
      hasDrawn = true;
      draw(e);
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!isDrawing) return;
      const { x, y } = getCoordinates(e);

      ctx.strokeStyle = strokeColor; // Use selected color (or white for eraser)
      ctx.lineWidth = strokeWidth;   // Use selected size (applies to both pen and eraser)

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

    clearBtn.addEventListener('click', () => {
      pushUndoSnapshot();
      fillWhite();
      hasDrawn = false;
    });

    // --- UPLOAD: drop a photo onto the canvas to draw over, scaled to
    // fit inside the 400x400 bitmap without stretching (contain-fit,
    // centered) so it always lands proportionally correct ---
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadInput = document.getElementById('uploadInput');

    uploadBtn.addEventListener('click', () => uploadInput.click());

    uploadInput.addEventListener('change', () => {
      const file = uploadInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (readerEvent) => {
        const img = new Image();
        img.onload = () => {
          pushUndoSnapshot();
          const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
          const drawWidth = img.width * scale;
          const drawHeight = img.height * scale;
          const offsetX = (canvas.width - drawWidth) / 2;
          const offsetY = (canvas.height - drawHeight) / 2;
          ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
          hasDrawn = true;
        };
        img.src = readerEvent.target.result;
      };
      reader.readAsDataURL(file);

      uploadInput.value = ''; // allow re-selecting the same file later
    });

    // --- EXPORT (save locally before submitting) ---
    const exportBtn = document.getElementById('exportBtn');
    exportBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'guestbook-drawing-' + Date.now() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // --- SUBMISSION LOGIC ---
    // The drawing is saved as a Base64 data URL directly inside the
    // Firestore document instead of a separate Cloud Storage upload — a
    // 400x400 canvas encodes to roughly ~30KB of text, well under
    // Firestore's 1MB-per-document limit, so this skips Storage (and
    // its billing requirement) entirely for a guestbook this size.
    submitBtn.addEventListener('click', async () => {
      const name = document.getElementById('visitorName').value.trim();
      const message = document.getElementById('visitorMessage').value.trim();

      if (!name) {
        alert("Please enter your name!");
        return;
      }
      if (!hasDrawn && !message) {
        alert("Leave a drawing or a message before submitting!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      try {
        // text-only entries skip the image entirely — a blank canvas
        // has nothing worth saving, and forcing one in kept producing
        // an all-white square with no information in it
        const entry = {
          name: name,
          message: message,
          status: 'pending', // a moderator has to approve it before it's public
          submittedAt: serverTimestamp()
        };
        if (hasDrawn) {
          entry.imageUrl = canvas.toDataURL('image/png');
        }

        await addDoc(collection(db, "guestbook"), entry);

        alert("Thanks! Your entry is pending review and will appear here once approved.");

        document.getElementById('visitorName').value = "";
        document.getElementById('visitorMessage').value = "";
        fillWhite();
        hasDrawn = false;
        undoStack.length = 0;
        redoStack.length = 0;
        loadGallery(); // show the new entry on the wall right away

      } catch (error) {
        console.error("Error submitting entry:", error);
        alert("Error saving. Make sure your database rules allow anonymous writes!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit";
      }
    });
  </script>

</body>
</html>
