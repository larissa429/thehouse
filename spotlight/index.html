<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Center Stage &middot; The House</title>
  <meta name="description" content="The House &middot; an object show" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital@0;1&family=Courier+Prime&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    /* Guards every [hidden] element in this page against being overridden
       by a later same-specificity `display:` class rule (.spotlight-shop's
       display:flex, specifically — bit us before on other pages, cheaper
       to fix it globally here). */
    [hidden] { display: none !important; }

    #spotlightGame {
      max-width: 56rem;
    }

    .spotlight-columns {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
    }
    .spotlight-left {
      flex: 1 1 26rem;
      min-width: 0;
    }
    .spotlight-right {
      flex: 1 1 18rem;
      min-width: 0;
    }
    @media (max-width: 640px) {
      .spotlight-columns { flex-direction: column; }
      .spotlight-left, .spotlight-right { flex: 1 1 auto; width: 100%; }
    }

    .spotlight-stage {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      margin: 0.5rem 0 1rem;
    }
    .spotlight-portrait-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .spotlight-portrait {
      width: 15rem;
      height: auto;
      display: block;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,0.5));
      transition: transform 0.08s ease;
    }
    .spotlight-portrait:active {
      transform: scale(0.96);
    }
    @keyframes spotlightPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.06) rotate(-1.5deg); }
      100% { transform: scale(1); }
    }
    .spotlight-portrait.is-clicked {
      animation: spotlightPop 0.22s ease;
    }

    /* floating "+1" that pops up near wherever you clicked and drifts away */
    .spotlight-float {
      position: absolute;
      pointer-events: none;
      font-family: var(--display);
      font-size: 1.1rem;
      color: var(--lamp);
      font-weight: bold;
      animation: spotlightFloat 0.9s ease forwards;
    }
    @keyframes spotlightFloat {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-2.2rem); }
    }
    .spotlight-float.is-crit {
      font-size: 1.6rem;
      color: var(--urgent);
    }

    /* Ambient fame effects — confetti/flowers/camera flashes, more
       frequent the higher her lifetime total climbs. Extends past the
       portrait's own box (negative inset) so falling pieces have room
       to read as coming from above/beside her, not just inside her. */
    .spotlight-fx-layer {
      position: absolute;
      inset: -3rem -2rem -1rem;
      pointer-events: none;
      overflow: visible;
    }
    .spotlight-fx {
      position: absolute;
      top: -1rem;
      font-size: 1.6rem;
      animation: spotlightFxFall 1.8s ease-in forwards;
    }
    @keyframes spotlightFxFall {
      0% { opacity: 0; transform: translateY(0) rotate(0deg); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translateY(14rem) rotate(var(--rot)); }
    }
    .spotlight-fx-camera {
      top: 10%;
      animation: spotlightFxPop 1.1s ease forwards;
    }
    @keyframes spotlightFxPop {
      0% { opacity: 0; transform: scale(0.5); }
      30% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0; transform: scale(1); }
    }
    .spotlight-fx-flash {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
      animation: spotlightFxFlash 0.35s ease;
    }
    @keyframes spotlightFxFlash {
      0% { opacity: 0; }
      15% { opacity: 0.85; }
      100% { opacity: 0; }
    }
    .merge-restart.is-active {
      background: var(--lamp);
      color: var(--shadow);
    }

    /* speech bubble to the side, same paper-and-tail language as the
       Crossroads/Uno bubbles, just laid out with flexbox instead of
       absolute positioning since there's only ever one speaker here */
    .spotlight-bubble {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 2.6rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--paper);
      color: var(--ink-on-paper);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }
    .spotlight-bubble::before {
      content: '';
      position: absolute;
      top: 1.1rem;
      left: -0.5rem;
      width: 0.9rem;
      height: 0.9rem;
      background: var(--paper);
      transform: rotate(45deg);
    }
    .spotlight-bubble-es {
      font-family: var(--hand);
      font-size: 1.25rem;
      line-height: 1.25;
      margin: 0;
    }
    .spotlight-bubble-en {
      font-family: var(--hand);
      font-size: 0.9rem;
      line-height: 1.2;
      margin: 0.25rem 0 0;
      opacity: 0.5;
    }
    @media (max-width: 520px) {
      .spotlight-stage {
        flex-direction: column;
        align-items: center;
      }
      .spotlight-bubble::before { display: none; }
      .spotlight-bubble { width: 100%; }
    }

    .spotlight-rate {
      text-align: center;
      font-family: var(--label);
      font-size: 0.75rem;
      color: var(--ink-soft);
      margin: -0.4rem 0 1rem;
    }

    .spotlight-shop-label {
      font-family: var(--label);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 0.5rem;
    }
    .spotlight-tab-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.7rem;
    }
    .spotlight-tab-btn {
      font-family: var(--label);
      font-size: 0.75rem;
      background: transparent;
      border: var(--edge);
      color: var(--ink-soft);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .spotlight-tab-btn:hover { background: var(--wall-lit); }
    .spotlight-tab-btn.is-active {
      background: var(--lamp);
      color: var(--shadow);
      border-color: var(--lamp);
    }
    .spotlight-shop {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .spotlight-upgrade {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0.9rem;
      background: var(--wall);
      border: var(--edge);
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-family: var(--body);
      color: var(--ink);
    }
    .spotlight-upgrade:hover:not(:disabled) { background: var(--wall-lit); }
    .spotlight-upgrade:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .spotlight-upgrade-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .spotlight-upgrade-name {
      font-family: var(--display);
      font-size: 1.05rem;
      color: var(--paper);
    }
    .spotlight-upgrade-desc {
      font-family: var(--label);
      font-size: 0.7rem;
      color: var(--ink-soft);
    }
    .spotlight-upgrade-cost {
      font-family: var(--label);
      font-size: 0.85rem;
      color: var(--lamp);
      white-space: nowrap;
    }
    .spotlight-upgrade-owned {
      font-family: var(--label);
      font-size: 0.7rem;
      color: var(--ink-soft);
      white-space: nowrap;
      min-width: 3.5rem;
      text-align: right;
    }
  </style>
</head>
<body>

  <site-header></site-header>

  <main class="wrap">

    <span class="eyebrow breadcrumb"><a href="../games/">&larr; Games</a></span>

    <h1>Center Stage</h1>
    <p>Abstract Painting is <em>utterly</em> convinced she's the main character. Click to give her the
      attention she's certain she deserves &mdash; then automate it, because even main characters need downtime.</p>

    <div class="merge-game" id="spotlightGame">
      <div class="merge-hud">
        <div class="merge-hud-block">
          <span class="merge-hud-label">Spotlight</span>
          <span class="merge-hud-value" id="spotlightCount">0</span>
        </div>
        <button type="button" class="merge-restart" id="spotlightEffectsToggle">Reduce Effects</button>
        <button type="button" class="merge-restart" id="spotlightReset">Reset</button>
      </div>

      <div class="spotlight-columns">
        <div class="spotlight-left">
          <div class="spotlight-stage">
            <div class="spotlight-portrait-wrap" id="spotlightPortraitWrap">
              <img src="../images/AP.png" alt="Abstract Painting" class="spotlight-portrait" id="spotlightPortrait" draggable="false" />
              <div class="spotlight-fx-layer" id="spotlightFxLayer"></div>
            </div>
            <div class="spotlight-bubble">
              <p class="spotlight-bubble-es" id="spotlightQuoteEs"></p>
              <p class="spotlight-bubble-en" id="spotlightQuoteEn"></p>
            </div>
          </div>

          <p class="spotlight-rate" id="spotlightRate" hidden></p>
        </div>

        <div class="spotlight-right">
          <div class="spotlight-tab-row">
            <button type="button" class="spotlight-tab-btn is-active" id="spotlightTabBoost" data-tab="boost">Preparation</button>
            <button type="button" class="spotlight-tab-btn" id="spotlightTabProduction" data-tab="production">Production</button>
          </div>
          <div class="spotlight-shop" id="spotlightBoostShop"></div>
          <div class="spotlight-shop" id="spotlightShop" hidden></div>
        </div>
      </div>
    </div>

  </main>

  <site-footer></site-footer>

  <script src="../components.js" defer></script>
  <script src="../spotlight.js" defer></script>
</body>
</html>
