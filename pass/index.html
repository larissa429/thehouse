<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Password</title>
<style>
  :root {
    --win-face: #c0c0c0;
    --win-face-light: #ffffff;
    --win-face-dark: #808080;
    --win-face-darker: #404040;
    --title-blue-1: #000080;
    --title-blue-2: #1084d0;
    --text: #000000;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: #008080;
    font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.035) 0px,
      rgba(0,0,0,0.035) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
    z-index: 10;
  }

  .window {
    width: 320px;
    background: var(--win-face);
    border: 2px solid;
    border-color: var(--win-face-light) var(--win-face-darker) var(--win-face-darker) var(--win-face-light);
    box-shadow: 3px 3px 0 rgba(0,0,0,0.4);
    animation: pop-in 0.12s ease-out;
  }

  @keyframes pop-in {
    from { transform: scale(0.96); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .titlebar {
    background: linear-gradient(90deg, var(--title-blue-1), var(--title-blue-2));
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 3px 3px 3px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    letter-spacing: 0.2px;
  }

  .titlebar .title-icon {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .titlebar .icon-lock {
    width: 12px;
    height: 12px;
    background: #ffd700;
    border: 1px solid #806000;
  }

  .titlebar-buttons {
    display: flex;
    gap: 2px;
  }

  .tb-btn {
    width: 16px;
    height: 14px;
    background: var(--win-face);
    border: 1px solid;
    border-color: var(--win-face-light) var(--win-face-darker) var(--win-face-darker) var(--win-face-light);
    font-size: 10px;
    line-height: 12px;
    text-align: center;
    color: black;
    font-weight: bold;
    cursor: default;
  }

  /* the close button is a real <button> now (so it's actually clickable/
     keyboard-accessible), so it needs its own reset — otherwise the
     browser's default button chrome (padding, appearance) fights with
     the .tb-btn styling above */
  .tb-btn-close {
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
  }

  .window-body {
    padding: 16px 14px 14px;
  }

  .prompt-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .prompt-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    background:
      radial-gradient(circle at 35% 30%, #ffe680, #ffd700 60%, #a67c00 100%);
    border-radius: 50%;
    position: relative;
    box-shadow: inset -3px -3px 4px rgba(0,0,0,0.25);
  }
  .prompt-icon::after {
    content: "?";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4a3300;
    font-weight: bold;
    font-size: 18px;
    font-family: 'Times New Roman', serif;
  }

  .prompt-label {
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
    margin: 0;
  }

  .input-row {
    margin-bottom: 16px;
    position: relative;
  }

  .input-field-wrap {
    position: relative;
    border: 2px solid;
    border-color: var(--win-face-darker) var(--win-face-light) var(--win-face-light) var(--win-face-darker);
    background: white;
  }

  input[type="password"],
  input[type="text"] {
    width: 100%;
    font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
    font-size: 13px;
    padding: 4px 6px;
    border: none;
    outline: none;
    background: transparent;
    color: black;
    position: relative;
    z-index: 2;
  }

  .placeholder-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    padding: 0 6px;
    font-size: 13px;
    color: #000;
    pointer-events: none;
    z-index: 1;
    background: white;
    transition: opacity 0.08s ease;
  }

  .placeholder-overlay.hidden {
    opacity: 0;
  }

  .button-row {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .win-btn {
    min-width: 75px;
    padding: 4px 12px;
    font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
    font-size: 12px;
    background: var(--win-face);
    border: 2px solid;
    border-color: var(--win-face-light) var(--win-face-darker) var(--win-face-darker) var(--win-face-light);
    cursor: pointer;
  }

  .win-btn:active {
    border-color: var(--win-face-darker) var(--win-face-light) var(--win-face-light) var(--win-face-darker);
    padding: 5px 11px 3px 13px;
  }

  .win-btn:focus {
    outline: 1px dotted black;
    outline-offset: -4px;
  }

  .status-line {
    margin-top: 12px;
    font-size: 11px;
    min-height: 14px;
    text-align: center;
    color: #800000;
  }

  .window.shake {
    animation: shake 0.35s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }

</style>
</head>
<body>

  <div class="window" id="win">
    <div class="titlebar">
      <div class="title-icon">
        <div class="icon-lock"></div>
        <span>System</span>
      </div>
      <div class="titlebar-buttons">
        <div class="tb-btn">_</div>
        <div class="tb-btn">&#9633;</div>
        <button type="button" class="tb-btn tb-btn-close" id="closeBtn">&times;</button>
      </div>
    </div>

    <div class="window-body" id="windowBody">
      <div class="prompt-row">
        <div class="prompt-icon"></div>
        <p class="prompt-label">A password is required to access this resource.</p>
      </div>

      <form id="pwForm" autocomplete="off">
        <div class="input-row">
          <div class="input-field-wrap">
            <div class="placeholder-overlay" id="placeholderOverlay">ENTER PASSWORD</div>
            <input type="text" id="pwInput" autocomplete="off">
          </div>
        </div>

        <div class="button-row">
          <button type="submit" class="win-btn">OK</button>
          <button type="button" class="win-btn" id="cancelBtn">Clear</button>
        </div>
      </form>

      <div class="status-line" id="status"></div>
    </div>
  </div>


<script>
  async function sha256(text) {
    const encoder = new TextEncoder();
    const data = encoder.encode(text.toLowerCase().trim());
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  let SUMMER_HASH = null;
  let PENNY_HASH = null;
  let QUIZ_HASH = null;
  (async () => {
    SUMMER_HASH = await sha256("summer28");
    PENNY_HASH = await sha256("penny");
    QUIZ_HASH = await sha256("allpages");
  })();

  const win = document.getElementById('win');
  const form = document.getElementById('pwForm');
  const input = document.getElementById('pwInput');
  const overlay = document.getElementById('placeholderOverlay');
  const status = document.getElementById('status');
  const cancelBtn = document.getElementById('cancelBtn');
  const closeBtn = document.getElementById('closeBtn');

  input.addEventListener('input', () => {
    overlay.classList.toggle('hidden', input.value.length > 0);
  });

  input.focus();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const guess = input.value;
    if (!guess) return;

    let guessHash;
    try {
      guessHash = await sha256(guess);
    } catch (err) {
      // crypto.subtle (used for hashing) only works in a secure context
      // (HTTPS) — without this catch, a failure here would silently
      // kill the whole handler and nothing would happen on submit at all
      console.error('Password check failed: ', err);
      status.textContent = "Something went wrong checking that — try reloading, or make sure you're on https://.";
      return;
    }

    if (guessHash === PENNY_HASH) {
      window.location.href = '../penny/';
    } else if (guessHash === SUMMER_HASH) {
      window.location.href = '../archive/';
    } else if (guessHash === QUIZ_HASH) {
      window.location.href = '../quizsecret/';
    } else {
      status.textContent = "Incorrect password.";
      win.classList.remove('shake');
      void win.offsetWidth;
      win.classList.add('shake');
      input.value = "";
      overlay.classList.remove('hidden');
      input.focus();
    }
  });

  cancelBtn.addEventListener('click', () => {
    input.value = "";
    overlay.classList.remove('hidden');
    status.textContent = "";
    input.focus();
  });

  closeBtn.addEventListener('click', () => {
    window.location.href = '../';
  });
</script>

</body>
</html>
