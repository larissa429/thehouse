<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misc &middot; Art &middot; The House</title>
  <meta name="description" content="The shitposty, unhinged, miscellaneous corner of The House's art." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital@0;1&family=Courier+Prime&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body>

  <site-header></site-header>

  <main class="wrap">

    <div class="desk-scene">
      <div class="desk" id="desk">

        <div class="desk-paper entering" style="--x:10%; --y:20%; --rot:-9deg; animation-delay:0ms;">
          <img src="../../images/art/comic1.png" alt="" draggable="false" />
        </div>
        <div class="desk-paper entering" style="--x:23%; --y:20%; --rot:6deg; animation-delay:120ms;">
          <img src="../../images/art/comic2.png" alt="" draggable="false" />
        </div>
        <div class="desk-paper entering" style="--x:36%; --y:20%; --rot:-4deg; animation-delay:240ms;">
          <img src="../../images/art/comic3.png" alt="" draggable="false" />
        </div>
        <div class="desk-paper entering" style="--x:49%; --y:20%; --rot:10deg; animation-delay:360ms;">
          <img src="../../images/art/comic4.png" alt="" draggable="false" />
        </div>
        <div class="desk-paper entering" style="--x:62%; --y:20%; --rot:-13deg; animation-delay:480ms;">
          <img src="../../images/art/comic5.png" alt="" draggable="false" />
        </div>
        <div class="desk-paper entering" style="--x:75%; --y:20%; --rot:5deg; animation-delay:600ms;">
          <img src="../../images/art/comic6.png" alt="" draggable="false" />
        </div>
        <div class="desk-paper entering" style="--x:88%; --y:20%; --rot:2deg; animation-delay:600ms;">
          <img src="../../images/art/comic7.png" alt="" draggable="false" />
        </div>
      </div>

      <div class="trash-zone">
        <div class="trash-can" id="trashCan">
          <img src="../../images/trash.png" alt="" draggable="false" />
        </div>
      </div>
    </div>
  </main>

  <div class="photo-overlay" id="photoOverlay">
    <button class="photo-close" id="photoClose">&times;</button>
    <img id="photoOverlayImg" src="" alt="" />
  </div>

  <site-footer></site-footer>

  <script src="../../components.js" defer></script>
  <script src="../../desk.js" defer></script>
</body>
</html>
