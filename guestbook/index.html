<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook &middot; The House</title>
  <meta name="description" content="The House &middot; an object show" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital@0;1&family=Courier+Prime&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>

  <site-header></site-header>

  <main class="wrap">

    <h1>Guestbook</h1>
    <p>Leave a doodle and a note for the residents to find. Everything here is public — sign it however you like.</p>

    <div class="guestbook-card">
      <input type="text" id="visitorName" class="guestbook-input" placeholder="Your Name" required />
      <textarea id="visitorMessage" class="guestbook-textarea" placeholder="Your Message..."></textarea>

      <div class="guestbook-palette">
        <div class="guestbook-swatch active" style="background-color: #000000;" data-color="#000000"></div>
        <div class="guestbook-swatch" style="background-color: #ff3333;" data-color="#ff3333"></div>
        <div class="guestbook-swatch" style="background-color: #0066ff;" data-color="#0066ff"></div>
        <div class="guestbook-swatch" style="background-color: #33cc33;" data-color="#33cc33"></div>
        <div class="guestbook-swatch" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
      </div>

      <div class="guestbook-controls">
        <div class="guestbook-sizes">
          <button type="button" class="guestbook-size-btn" data-size="2">2px</button>
          <button type="button" class="guestbook-size-btn active" data-size="5">5px</button>
          <button type="button" class="guestbook-size-btn" data-size="10">10px</button>
          <button type="button" class="guestbook-size-btn" data-size="20">20px</button>
        </div>
        <button type="button" id="eraserBtn" class="guestbook-eraser-btn">Eraser &#129504;</button>
      </div>

      <canvas id="artCanvas" class="guestbook-canvas" width="400" height="400"></canvas>

      <div class="guestbook-btn-row">
        <button type="button" id="clearBtn" class="guestbook-btn guestbook-btn-clear">Clear Canvas</button>
        <button type="button" id="submitBtn" class="guestbook-btn guestbook-btn-submit">Submit</button>
      </div>
    </div>

  </main>

  <site-footer></site-footer>

  <script src="../components.js" defer></script>

  <script type="module">
    // 1. Import Firebase from the official Google CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALJut-42S2SOUz7pZXJj2A5AMe3QHd0o0",
      authDomain: "thehouse-f578b.firebaseapp.com",
      projectId: "thehouse-f578b",
      storageBucket: "thehouse-f578b.firebasestorage.app",
      messagingSenderId: "60360197597",
      appId: "1:60360197597:web:21d011ec9ac8111f15a234",
      measurementId: "G-CMQQ8JFV2V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const auth = getAuth(app);

    signInAnonymously(auth)
      .then(() => console.log("Logged in anonymously!"))
      .catch((error) => console.error("Anonymous login failed: ", error));

    // --- DRAWING CANVAS LOGIC ---
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');
    let isDrawing = false;

    ctx.lineCap = 'round';

    // Color Swatch Logic
    const swatches = document.querySelectorAll('.guestbook-swatch');
    let strokeColor = '#000000'; // Default drawing color (black)
    let previousColor = '#000000'; // Stores last color used

    swatches.forEach(swatch => {
      swatch.addEventListener('click', (e) => {
        // Turn off eraser if it was on
        isEraser = false;
        eraserBtn.classList.remove('active');

        swatches.forEach(s => s.classList.remove('active'));
        e.target.classList.add('active');

        strokeColor = e.target.getAttribute('data-color');
        previousColor = strokeColor;
      });
    });

    // --- BRUSH SIZE LOGIC ---
    const sizeBtns = document.querySelectorAll('.guestbook-size-btn');
    let strokeWidth = 5; // Default drawing width (5px)

    sizeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        sizeBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        strokeWidth = parseInt(e.target.getAttribute('data-size'));
      });
    });

    // --- ERASER TOOL LOGIC ---
    const eraserBtn = document.getElementById('eraserBtn');
    let isEraser = false;

    eraserBtn.addEventListener('click', () => {
      isEraser = !isEraser;
      if (isEraser) {
        eraserBtn.classList.add('active');
        swatches.forEach(s => s.classList.remove('active'));
        strokeColor = '#ffffff'; // Painting with canvas background color (white)
      } else {
        eraserBtn.classList.remove('active');
        strokeColor = previousColor;
        const activeSwatch = Array.from(swatches).find(s => s.getAttribute('data-color') === previousColor);
        if (activeSwatch) activeSwatch.classList.add('active');
      }
    });

    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      draw(e);
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!isDrawing) return;
      const { x, y } = getCoordinates(e);

      ctx.strokeStyle = strokeColor; // Use selected color (or white for eraser)
      ctx.lineWidth = strokeWidth;   // Use selected size (applies to both pen and eraser)

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    canvas.addEventListener('mousemove', draw);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // --- SUBMISSION LOGIC ---
    submitBtn.addEventListener('click', () => {
      const name = document.getElementById('visitorName').value.trim();
      const message = document.getElementById('visitorMessage').value.trim();

      if (!name) {
        alert("Please enter your name!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      canvas.toBlob(async (blob) => {
        if (!blob) {
          alert("Canvas error!");
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        try {
          const filename = `guestbook_drawings/${Date.now()}.png`;
          const storageRef = ref(storage, filename);
          const snapshot = await uploadBytes(storageRef, blob);

          const imageUrl = await getDownloadURL(snapshot.ref);

          await addDoc(collection(db, "guestbook"), {
            name: name,
            message: message,
            imageUrl: imageUrl,
            submittedAt: serverTimestamp()
          });

          alert("Successfully sent! Thank you for your message.");

          document.getElementById('visitorName').value = "";
          document.getElementById('visitorMessage').value = "";
          ctx.clearRect(0, 0, canvas.width, canvas.height);

        } catch (error) {
          console.error("Error submitting entry:", error);
          alert("Error saving. Make sure your database and storage rules allow anonymous writes!");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
        }
      }, 'image/png');
    });
  </script>

</body>
</html>
